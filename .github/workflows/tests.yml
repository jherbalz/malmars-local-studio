name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the test-only dependency
        run: python -m pip install --upgrade pip pillow
      - name: Content screen
        run: python -m unittest discover -s safety -v
      - name: Print Station
        run: python -m unittest discover -s print_station -v
